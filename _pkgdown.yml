template:
  bootstrap: 5
  includes:
  after_body: pkgdown/after-body.html

url: https://thomas-rauter.github.io/scholid/

pkgdown:
  title: scholid

navbar:
  structure:
    left:
      - home
      - get-started
      - reference
      - scholid-definitions
      - news

  components:
    get-started:
      text: "Get started"
      href: articles/get_started.html
    
    scholid-definitions:
      text: "About identifiers"
      href: articles/scholid_definitions.html

    news:
      text: "News"
      href: news/index.html

reference:
  - title: User Available Functions
    desc: >
      Documentation for all user-facing functions (for internal functions,
      see GitHub).
    contents:
      - classify_scholid
      - extract_scholid
      - is_scholid
      - normalize_scholid
      - scholid_types
      - detect_scholid_type
      
development:
  mode: auto


